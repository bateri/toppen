[package]
name = "toppen"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "A system monitor in the terminal pane: CPU, memory, network, disks, GPU and a process table you can sort, filter and signal with the keyboard or the mouse"
repository = "https://github.com/bateri/toppen"

[[bin]]
name = "toppen"
path = "src/program/main.rs"

[dependencies]
# The program's side of pencere. Every pencere crate here is at the same commit, written whole:
# Cargo.lock is where it is pinned.
pencere = { git = "https://github.com/bateri/pencere", rev = "51ad77d29b837df3f224fc6adbb60e3230796bf1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# What the machine measures: CPUs, memory, processes, network interfaces, disks, sensors. 0.38 is the
# last release that builds with the toolchain the pens share (rust 1.88).
sysinfo = { version = "0.38", default-features = false, features = ["system", "network", "disk", "component", "user"] }
# The filter's /regular expressions/: the engine that runs in time linear in the text (no
# back-references, no look-around), MIT or Apache-2.0, and already in Cargo.lock under pencere.
regex = "1"
# What sysinfo does not say, and the signals: the machine's name, kill(2), setpriority(2).
libc = "0.2"

[build-dependencies]
pencere = { git = "https://github.com/bateri/pencere", rev = "51ad77d29b837df3f224fc6adbb60e3230796bf1" }

[dev-dependencies]
# Each test has a directory of its own as its home.
tempfile = "3"
# The page (src/view/) run as a terminal runs it, with no screen: the kit's interpreter and editors,
# a clock the test moves, and the program's own handlers in this process (`program`); and pictures
# of it for the eye, in the fonts of the machine (`shot`, `make shots`).
pencere-drive = { git = "https://github.com/bateri/pencere", rev = "51ad77d29b837df3f224fc6adbb60e3230796bf1", features = ["program", "shot"] }
# The names of the page's elements (`Id`).
pencere-view = { git = "https://github.com/bateri/pencere", rev = "51ad77d29b837df3f224fc6adbb60e3230796bf1" }
# The files of a page's bundle (`Assets`): a test's own script beside the page; and what a page's
# calls are held to (`ModuleLimits`).
pencere-sandbox = { git = "https://github.com/bateri/pencere", rev = "51ad77d29b837df3f224fc6adbb60e3230796bf1" }

# The page tests compile the kit's interpreter to machine code, with wasmtime's code generator, as
# each page opens; built without optimization (a debug build) that takes some 13 seconds a page,
# optimized about one. The generator and what feeds it are optimized in the development profile
# too, as pencere's own workspace does: compiled once, cached with the rest.
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2
[profile.dev.package.cranelift-bforest]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2
[profile.dev.package.wasmtime-environ]
opt-level = 2
[profile.dev.package.wasmparser]
opt-level = 2

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
