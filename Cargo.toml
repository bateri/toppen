[package]
name = "toppen"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
description = "A system monitor in the terminal pane: CPU, memory, network, disks, GPU and a process table you can sort, filter and signal with the keyboard or the mouse"
repository = "https://github.com/bateri/toppen"

[[bin]]
name = "toppen"
path = "src/program/main.rs"

[dependencies]
# The program's side of pencere, at the commit that has `pencere dist`, which writes the app.json of
# a release (the release on crates.io does not yet): every pencere crate here is at this one `rev`,
# which Cargo.lock holds and `make pencere`, `make fake-host` and `make dev` build the terminal from.
pencere = { git = "https://github.com/bateri/pencere", rev = "aafde273ee048d85e4c6dcb255472709c518f9a2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# What the machine measures: CPUs, memory, processes, network interfaces, disks, sensors. 0.38 is the
# last release that builds with rust 1.88, the toolchain the pens shared before 1.99.
sysinfo = { version = "0.38", default-features = false, features = ["system", "network", "disk", "component", "user"] }
# The filter's /regular expressions/: the engine that runs in time linear in the text (no
# back-references, no look-around), MIT or Apache-2.0, and already in Cargo.lock under pencere.
regex = "1"
# What sysinfo does not say, and the signals: the machine's name, kill(2), setpriority(2).
libc = "0.2"
# The program's own screen where the terminal hosts no view: the page drawn as pictures in the terminal
# it is started in, where that speaks the Kitty graphics protocol (the `terminal` feature). Built with
# the interpreter compiled by the build (`precompile`) and no PDF reader: a monitor shows none, and
# neither the code generator nor the reader is then in the file.
pencere-tui = { git = "https://github.com/bateri/pencere", rev = "aafde273ee048d85e4c6dcb255472709c518f9a2", optional = true, default-features = false, features = ["precompile"] }

[features]
# Two builds: with the screen (the default: a terminal that does not host pencere but speaks the Kitty
# graphics protocol shows the monitor drawn as pictures), and without it (`--no-default-features`: the
# smaller file, for a terminal that hosts pencere and for the person who wants the summary and nothing
# more).
default = ["terminal"]
terminal = ["dep:pencere-tui"]

[build-dependencies]
pencere = { git = "https://github.com/bateri/pencere", rev = "aafde273ee048d85e4c6dcb255472709c518f9a2" }

[dev-dependencies]
# Each test has a directory of its own as its home.
tempfile = "3"
# The page (src/view/) run as a terminal runs it, with no screen: the kit's interpreter and editors,
# a clock the test moves, and the program's own handlers in this process (`program`); and pictures
# of it for the eye, in the fonts of the machine (`shot`, `make shots`).
pencere-drive = { git = "https://github.com/bateri/pencere", rev = "aafde273ee048d85e4c6dcb255472709c518f9a2", features = ["program", "shot"] }
# The names of the page's elements (`Id`).
pencere-view = { git = "https://github.com/bateri/pencere", rev = "aafde273ee048d85e4c6dcb255472709c518f9a2" }
# The files of a page's bundle (`Assets`): a test's own script beside the page; and what a page's
# calls are held to (`ModuleLimits`).
pencere-sandbox = { git = "https://github.com/bateri/pencere", rev = "aafde273ee048d85e4c6dcb255472709c518f9a2" }

# The page tests compile the kit's interpreter to machine code, with wasmtime's code generator, as
# each page opens; built without optimization (a debug build) that takes some 13 seconds a page,
# optimized about one. The generator and what feeds it are optimized in the development profile
# too, as pencere's own workspace does: compiled once, cached with the rest.
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2
[profile.dev.package.cranelift-bforest]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2
[profile.dev.package.wasmtime-environ]
opt-level = 2
[profile.dev.package.wasmparser]
opt-level = 2

# The profile of the file that is shipped: `cargo build --profile dist` (nothing builds it yet).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
